<div class="school-login-page">

  <div class="school-login-card">

<div class="school-login-brand">

  <div class="school-logo">
    DL
  </div>

  <h1>
    D Little
  </h1>

  <p>
    Private School
  </p>

</div>


<div class="login-heading">

  <h2>
    School Portal
  </h2>

  <p>
    Sign in to access your account
  </p>

</div>


<div
  class="login-error"
  *ngIf="errorMessage">

  {{ errorMessage }}

</div>


<form
  (ngSubmit)="login()"
  #loginForm="ngForm">


  <!-- SCHOOL ID -->

  <div class="form-group">

    <label for="schoolId">
      School ID
    </label>

    <input
      id="schoolId"
      type="text"
      name="schoolId"
      [(ngModel)]="schoolId"
      placeholder="Enter your School ID"
      autocomplete="username"
      required
    />

  </div>


  <!-- PASSWORD -->

  <div class="form-group">

    <label for="password">
      Password
    </label>

    <input
      id="password"
      type="password"
      name="password"
      [(ngModel)]="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      required
    />

  </div>


  <!-- LOGIN BUTTON -->

  <button
    type="submit"
    class="login-button"
    [disabled]="loading || loginForm.invalid">

    <span *ngIf="!loading">
      Sign In
    </span>

    <span *ngIf="loading">
      Signing In...
    </span>

  </button>

</form>


<div class="login-footer">

  <p>
    D Little Private School
  </p>

  <span>
    Student • Parent • Teacher Portal
  </span>

</div>


  </div>

</div>
